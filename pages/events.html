<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events — Soil and Water Conservation Club</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/events-page.css">
</head>

<body>
    <div id="menu-placeholder"></div>
    <main class="events-page">
        <div id="event-bg" class="event-background"></div>
        <div class="event-details-overlay">
            <div id="event-info" class="event-info">
                <h1 id="main-title"></h1>
                <p id="main-date-location" class="date-location"></p>
                <p id="main-description" class="description"></p>
                <div id="event-countdown" class="countdown-timer"></div>
                <div class="button-group">
                    <button id="download-ics-btn" class="download-btn" type="button">Add to Calendar (.ics)</button>
                    <button id="pause-btn" class="pause-btn" type="button">Pause</button>
                </div>
                <div id="thumbnail-gallery-wrapper" class="thumbnail-gallery-wrapper">
                    <button id="prev-btn" class="nav-arrow prev" type="button" aria-label="Previous event">&lt;</button>
                    <div id="thumbnail-gallery" class="thumbnail-gallery"></div>
                    <button id="next-btn" class="nav-arrow next" type="button" aria-label="Next event">&gt;</button>
                </div>
            </div>
        </div>
    </main>
    <script src="../assets/js/site.js"></script>
    <script>
        let events = [];
        let currentIndex = 0;
        let isPaused = true;
        let cycleInterval;
        let countdownInterval;

        function showEvent(index) {
            const event = events[index];
            const bg = document.getElementById("event-bg");
            const info = document.getElementById("event-info");
            document.querySelectorAll(".thumbnail-container").forEach((thumb) => thumb.classList.remove("active"));
            const activeThumb = document.getElementById(`thumb-${index}`);
            activeThumb.classList.add("active");
            activeThumb.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" });
            document.getElementById("prev-btn").disabled = index === 0;
            document.getElementById("next-btn").disabled = index === events.length - 1;
            info.classList.remove("active");
            setTimeout(() => {
                if (event.image) {
                    bg.style.backgroundImage = `url(${assetPath(event.image)})`;
                    bg.classList.remove("no-photo");
                } else {
                    bg.style.backgroundImage = "none";
                    bg.classList.add("no-photo");
                }
                document.getElementById("main-title").textContent = event.title;
                const where = formatEventWhen(event);
                document.getElementById("main-date-location").innerHTML = event.location
                    ? `${escapeHtml(where)}<br>${escapeHtml(event.location)}`
                    : escapeHtml(where);
                document.getElementById("main-description").textContent = event.description;
                const countdown = document.getElementById("event-countdown");
                const download = document.getElementById("download-ics-btn");
                if (countdownInterval) clearInterval(countdownInterval);
                if (eventIsPast(event, new Date())) {
                    countdown.textContent = "This event has passed.";
                } else if (event.time && event.date.length === 10) {
                    const tick = () => {
                        const diff = eventDate(event) - new Date();
                        if (diff <= 0) {
                            countdown.textContent = "This event has passed.";
                            return;
                        }
                        const days = Math.floor(diff / 86400000);
                        countdown.textContent = days >= 2
                            ? `This event starts in ${days} days.`
                            : `This event starts in ${Math.floor(diff / 3600000)} hours.`;
                    };
                    tick();
                    countdownInterval = setInterval(tick, 60000);
                } else {
                    countdown.textContent = "Date is the month on file. A start time is not recorded.";
                }
                const canSave = event.time && event.date.length === 10;
                download.hidden = !canSave;
                download.onclick = () => { if (canSave) downloadICS(event); };
                info.classList.add("active");
            }, 300);
        }

        function downloadICS(event) {
            const dateStamp = event.date.replace(/-/g, "");
            const start = `${dateStamp}T${event.time.replace(":", "")}00`;
            const endHour = String(Number(event.time.slice(0, 2)) + 2).padStart(2, "0");
            const end = `${dateStamp}T${endHour}${event.time.slice(3, 5)}00`;
            const ics = [
                "BEGIN:VCALENDAR",
                "VERSION:2.0",
                "PRODID:-//SWCC//EN",
                "BEGIN:VEVENT",
                `SUMMARY:${event.title}`,
                `DTSTART:${start}`,
                `DTEND:${end}`,
                `LOCATION:${event.location || ""}`,
                `DESCRIPTION:${event.description}`,
                "END:VEVENT",
                "END:VCALENDAR",
            ].join("\r\n");
            const url = URL.createObjectURL(new Blob([ics], { type: "text/calendar" }));
            const link = document.createElement("a");
            link.href = url;
            link.download = `${event.title.replace(/\s+/g, "_")}.ics`;
            link.click();
            URL.revokeObjectURL(url);
        }

        function renderThumbs() {
            const gallery = document.getElementById("thumbnail-gallery");
            gallery.innerHTML = events.map((event, index) => {
                const photo = event.thumbnail
                    ? `<img src="${assetPath(event.thumbnail)}" alt="">`
                    : "";
                const when = eventParts(event);
                const label = when.day == null
                    ? new Date(when.year, when.month - 1, 1).toLocaleString("en-US", { month: "short" })
                    : `${new Date(when.year, when.month - 1, 1).toLocaleString("en-US", { month: "short" })} ${String(when.day).padStart(2, "0")}`;
                return `
                    <div class="thumbnail-container${event.thumbnail ? "" : " no-photo"}" id="thumb-${index}">
                        ${photo}
                        <div class="thumbnail-overlay">
                            <span class="title">${escapeHtml(event.title)}</span>
                            <span class="date">${escapeHtml(label)}</span>
                        </div>
                    </div>
                `;
            }).join("");
            gallery.querySelectorAll(".thumbnail-container").forEach((thumb, index) => {
                thumb.addEventListener("click", () => {
                    currentIndex = index;
                    showEvent(index);
                });
            });
        }

        function startCycle() {
            if (cycleInterval) clearInterval(cycleInterval);
            if (isPaused) return;
            cycleInterval = setInterval(() => {
                currentIndex = (currentIndex + 1) % events.length;
                showEvent(currentIndex);
            }, 15000);
        }

        loadMenu().catch((error) => console.error(error));
        loadJSON("../data/events.json").then((payload) => {
            const now = new Date();
            events = payload.items.slice().sort((a, b) => eventDate(b) - eventDate(a));
            const info = document.getElementById("event-info");
            if (!events.length) {
                document.getElementById("main-title").textContent = "No events posted";
                document.getElementById("main-description").textContent = payload.intro || "";
                document.getElementById("download-ics-btn").hidden = true;
                document.getElementById("pause-btn").hidden = true;
                document.getElementById("thumbnail-gallery-wrapper").hidden = true;
                info.classList.add("active");
                return;
            }
            const upcoming = events.findIndex((event) => !eventIsPast(event, now));
            currentIndex = upcoming === -1 ? 0 : upcoming;
            isPaused = upcoming === -1;
            document.getElementById("pause-btn").textContent = isPaused ? "Play" : "Pause";
            renderThumbs();
            showEvent(currentIndex);
            startCycle();
        }).catch((error) => console.error(error));

        document.getElementById("prev-btn").addEventListener("click", () => {
            if (currentIndex > 0) showEvent(--currentIndex);
        });
        document.getElementById("next-btn").addEventListener("click", () => {
            if (currentIndex < events.length - 1) showEvent(++currentIndex);
        });
        document.getElementById("pause-btn").addEventListener("click", () => {
            isPaused = !isPaused;
            document.getElementById("pause-btn").textContent = isPaused ? "Play" : "Pause";
            if (cycleInterval) clearInterval(cycleInterval);
            startCycle();
        });
    </script>
</body>

</html>
