<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — Soil and Water Conservation Club</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/contact-page.css">
</head>

<body>
    <div id="menu-placeholder"></div>
    <main class="contact-page">
        <header class="page-header">
            <h1>Officers</h1>
            <p id="officers-intro"></p>
        </header>
        <div class="officers-grid" id="officers-grid"></div>
        <section class="reach" id="reach"></section>
    </main>
    <script src="../assets/js/site.js"></script>
    <script>
        loadMenu().catch((error) => console.error(error));

        function portrait(person) {
            if (person.photo) {
                return `<img src="${assetPath(person.photo)}" alt="${escapeHtml(person.name)}">`;
            }
            return `<div class="headshot-fallback" aria-hidden="true">${escapeHtml(initials(person.name))}</div>`;
        }

        Promise.all([
            loadJSON("../data/officers.json"),
            loadJSON("../data/site.json"),
        ]).then(([officers, site]) => {
            document.getElementById("officers-intro").textContent = officers.intro;
            document.getElementById("officers-grid").innerHTML = officers.people.map((person) => {
                const mail = person.email
                    ? `<a class="social-link email" href="mailto:${escapeHtml(person.email)}">Email</a>`
                    : "";
                return `
                    <article class="officer-card">
                        <div class="headshot-container">${portrait(person)}</div>
                        <div class="officer-info">
                            <span class="officer-role">${escapeHtml(person.role)}</span>
                            <h2 class="officer-name">${escapeHtml(person.name)}</h2>
                            <p class="officer-description">${escapeHtml(person.description)}</p>
                            <div class="officer-links">${mail}</div>
                        </div>
                    </article>
                `;
            }).join("");
            const lines = site.mail.map((line) => escapeHtml(line)).join("<br>");
            document.getElementById("reach").innerHTML = `
                <h2>Contact</h2>
                <p><a href="mailto:${escapeHtml(site.emails.exec)}">${escapeHtml(site.emails.exec)}</a></p>
                <p><a href="mailto:${escapeHtml(site.emails.advisor)}">${escapeHtml(site.emails.advisor)}</a></p>
                <p>${escapeHtml(site.phone)}</p>
                <p>${lines}</p>
                <p><a href="${escapeHtml(site.stuorg)}">Student Organizations page</a></p>
            `;
        }).catch((error) => console.error(error));
    </script>
</body>

</html>
