<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products — Soil and Water Conservation Club</title>
    <link rel="stylesheet" href="../styles/products-page.css">
</head>

<body>
    <div id="menu-placeholder"></div>
    <main class="products-page">
        <header class="page-header">
            <h1>Products</h1>
            <p id="products-intro"></p>
        </header>
        <div class="products-grid" id="products-grid"></div>
    </main>
    <script src="../assets/js/site.js"></script>
    <script>
        function productHref(href) {
            if (/^(https?:|mailto:|\/)/.test(href)) return href;
            if (href.startsWith("pages/")) return href.slice("pages/".length);
            return assetPath(href);
        }

        loadMenu().catch((error) => console.error(error));
        loadJSON("../data/products.json").then((products) => {
            document.getElementById("products-intro").textContent = products.intro;
            const grid = document.getElementById("products-grid");
            grid.innerHTML = products.items.map((item) => {
                const image = item.image
                    ? `<img class="product-image" src="${assetPath(item.image)}" alt="">`
                    : "";
                const link = item.link_href && item.link_label
                    ? `<a class="product-link" href="${productHref(item.link_href)}">${escapeHtml(item.link_label)}</a>`
                    : "";
                return `
                    <article class="product-card">
                        ${image}
                        <div class="product-body">
                            <span class="product-tag">${escapeHtml(item.tag)}</span>
                            <h2>${escapeHtml(item.title)}</h2>
                            <p>${escapeHtml(item.description)}</p>
                            ${link}
                        </div>
                    </article>
                `;
            }).join("");
        }).catch((error) => console.error(error));
    </script>
</body>

</html>
