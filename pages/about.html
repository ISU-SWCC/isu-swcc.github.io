<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About — Soil and Water Conservation Club</title>
    <link rel="stylesheet" href="../styles/about-page.css">
</head>

<body>
    <div id="menu-placeholder"></div>
    <main class="about-page" id="about-root"></main>
    <script src="../assets/js/site.js"></script>
    <script>
        loadMenu().catch((error) => console.error(error));
        loadJSON("../data/about.json").then((about) => {
            const root = document.getElementById("about-root");
            const jumps = about.sections.map((section) =>
                `<a href="#${escapeHtml(section.id)}">${escapeHtml(section.heading)}</a>`
            ).join("");
            const intro = about.intro.map((paragraph) => `<p>${escapeHtml(paragraph)}</p>`).join("");
            const sections = about.sections.map((section) => `
                <section id="${escapeHtml(section.id)}">
                    <h2>${escapeHtml(section.heading)}</h2>
                    ${section.paragraphs.map((paragraph) => `<p>${escapeHtml(paragraph)}</p>`).join("")}
                </section>
            `).join("");
            root.innerHTML = `
                <section class="hero-section">
                    <span class="bold-heading">About SWCC</span>
                    <h1>${escapeHtml(about.title)}</h1>
                    <img class="hero-logo" src="${assetPath(about.hero)}" alt="Soil and Water Conservation Club logo">
                    ${intro}
                    <nav class="jump-links">${jumps}</nav>
                </section>
                ${sections}
            `;
        }).catch((error) => console.error(error));
    </script>
</body>

</html>
